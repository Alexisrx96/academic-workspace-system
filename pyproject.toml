[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utec-academic-workspace"
version = "0.1.0"
description = "Sincronización determinista Blackboard Learn -> bóveda Obsidian"
requires-python = ">=3.11"
dependencies = ["bleach>=6,<7", "pypdf>=6,<7", "python-docx>=1.2,<2", "Markdown>=3.7,<4"]

[project.optional-dependencies]
browser = ["playwright>=1.54,<2"]
dev = ["pytest>=8,<9"]
embeddings = ["sentence-transformers>=3,<6"]
mcp = ["mcp>=1,<2"]
ocr = [
    "rapidocr-onnxruntime>=1.4,<2",
]

[project.scripts]
academic-workspace = "academic_workspace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_workspace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
